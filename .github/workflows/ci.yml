name: ci
on:
  push:
  pull_request:
jobs:
  public-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Secret and structure scan
        run: bash scripts/secret-scan.sh
      - name: Package structure checks
        run: |
          test -f versions.env
          test -d overlays/fuchsia/src/ui/bin/tiling_wm
          test -d overlays/fuchsia/src/fuchsia-desktop
          test -f design/screenshots/01-instrument-studio.png
          test -f design/screenshots/04-emulator-four-app-live.png
          test -f design/screenshots/05-emulator-chrome-live.png
          test -f design/screenshots/06-emulator-density-live.png
          test -f design/screenshots/07-emulator-icons-live.png
          test -f docs/production-status.md
          test -f docs/linux-terminal.md
          test -f overlays/fuchsia/src/fuchsia-desktop/terminal/src/linux_console_bridge.rs
          test -f design/screenshots/08-emulator-linux-terminal.png
          test -f design/screenshots/09-emulator-labels-live.png
          test -f design/screenshots/10-emulator-readable-labels-live.png
          test -f design/screenshots/11-emulator-ocr-labels-live.png
          test -f design/screenshots/12-emulator-responsive-live.png
          test -f design/screenshots/13-emulator-parity-live.png
          test -f design/screenshots/14-emulator-tile-identity-live.png
          test -f design/screenshots/16-emulator-looks-cards-live.png
          test -f design/screenshots/17-emulator-tile-names-live.png
          test -f design/screenshots/18-emulator-set-restore-live.png
          test -f design/screenshots/19-emulator-settings-cards-live.png
          test -f design/screenshots/20-emulator-menu-text-live.png
          test -f docs/evidence/instrument-studio-menu-text-20260820T000156Z/vision-comparison.md
          test -f docs/evidence/instrument-studio-settings-cards-20260819T160901Z/vision-comparison.md
          test -f docs/evidence/instrument-studio-set-restore-20260819T155032Z/vision-comparison.md
          test -f docs/evidence/instrument-studio-tile-names-live-20260819T150408Z/vision-comparison.md
          test -f docs/evidence/instrument-studio-looks-20260819T143013Z/vision-comparison.md
          test -f docs/design-vision-bead-matrix.md
          test -f docs/evidence/instrument-studio-tile-identity-20260819T133604Z/vision-comparison.md
          test -f docs/evidence/instrument-studio-parity-20260819T113247Z/vision-comparison.md
          python3 scripts/test-narrow-app-layout.py
          python3 scripts/test-tile-identity.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-font-chrome-source.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-fuchsia-studio-help.py
          test -f docs/evidence/instrument-studio-responsive-20260819T030934Z/vision-comparison.md
          test -f docs/evidence/instrument-studio-ocr-labels-20260819T025833Z/vision-comparison.md
          test -f docs/evidence/instrument-studio-readable-labels-20260819T024408Z/vision-comparison.md
          test -f docs/evidence/instrument-studio-labels-20260819T020608Z/vision-comparison.md
          grep -q linux_container overlays/fuchsia/products/workbench/workbench_session/meta/workbench_session.cml
          grep -q linux_console_bridge overlays/fuchsia/src/fuchsia-desktop/terminal/meta/fuchsia_terminal.cml
          test -f docs/evidence/instrument-studio-icons-20260819T001859Z/vision-comparison.md
          test -f docs/evidence/instrument-studio-density-20260818T230716Z/vision-comparison.md
          test -f overlays/fuchsia/src/ui/bin/tiling_wm/src/chrome.rs
          test -f docs/evidence/instrument-studio-chrome-20260818T225220Z/vision-comparison.md
          test -f docs/evidence/instrument-studio-20260818T220823Z/vision-comparison.md
          test -f design/sketches/01-instrument-studio/index.html
          test -f overlays/fuchsia/src/ui/bin/tiling_wm/src/observability.rs
          test -f scripts/collect-desktop-diagnostics.sh
          test -f scripts/design-feedback-report.py
          test -f docs/observability-feedback-loop.md
          test -f docs/instrument-studio-ui-map.md
          test -f overlays/fuchsia/src/fuchsia-desktop/desktop_ui/src/lib.rs
          test -f overlays/fuchsia/src/fuchsia-desktop/desktop_ui/src/tokens.rs
          test -f overlays/fuchsia/src/fuchsia-desktop/desktop_ui/src/chrome.rs
          test ! -e overlays/fuchsia/src/fuchsia-desktop/agent-linux/authorized_keys
          test ! -e state
          test ! -e source
          test ! -e sdk
          if find . -type f \( -name 'id_ed25519' -o -name 'id_rsa' -o -name '*.pem' -o -name 'authorized_keys' \) | grep .; then
            echo 'forbidden credential filenames present' >&2
            exit 1
          fi
      - name: Shell syntax
        run: |
          python3 scripts/check-shell-syntax.py
          python3 scripts/test-shell-syntax-gate.py
      - name: Python compile
        run: |
          python3 -m py_compile scripts/*.py tools/native_theme/*.py
      - name: NativeThemeV1 bounded contract proof
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-native-theme-v1.py
      - name: NativeThemeV1 legacy oracle proof
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-native-theme-legacy-oracle.py
      - name: Prepare NativeThemeV1 sq-01 dependencies
        run: python3 -m pip install --requirement tools/native_theme/sq01-requirements.txt
      - name: NativeThemeV1 sq-01 source-quality gate
        run: PYTHONDONTWRITEBYTECODE=1 TZ=UTC LC_ALL=C LANG=C PYTHONHASHSEED=0 NATIVE_THEME_SQ01_NETWORK=deny python3 scripts/test-native-theme-sq01.py --source-sha "$GITHUB_SHA" --output-dir artifacts/quality/sq-01
      - name: Upload NativeThemeV1 sq-01 receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-theme-sq-01-${{ github.sha }}
          path: |
            artifacts/quality/sq-01/source-manifest.json
            artifacts/quality/sq-01/profile-fixture-inventory.json
            artifacts/quality/sq-01/schema-validation.json
            artifacts/quality/sq-01/semantic-conformance.json
            artifacts/quality/sq-01/mutation-results.json
            artifacts/quality/sq-01/public-boundary-and-license-scan.json
            artifacts/quality/sq-01/verdict.json
      - name: Instrument Studio desktop_ui host contract
        run: python3 scripts/test-desktop-ui-host.py
      - name: Design feedback empty fixture
        run: |
          mkdir -p /tmp/df-empty
          python3 scripts/design-feedback-report.py --out-dir /tmp/df-empty > /tmp/df-empty/out.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/df-empty/out.json'))
          assert d['evaluation']['ready_for_ui_iteration'] is False
          assert d['wm']['available'] is False
          print('fixture_ok')
          PY
